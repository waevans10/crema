[project]
name = "crema"
version = "1.1.0"
description = "Automated GaggiMate shot-history reviewer that uses Claude to suggest grind/dose/profile adjustments."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Claude API
    "anthropic>=0.69",
    # Vendored gaggimate_mcp runtime deps (parser + device API clients)
    "aiohttp>=3.11",
    "websockets>=15",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24",
    # crema
    "aiosqlite>=0.20",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "python-multipart>=0.0.12",
    "uvicorn>=0.32",
    "jinja2>=3.1",
    "typer>=0.15",
]

[project.scripts]
crema = "crema.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crema", "src/gaggimate_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
